<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markt-Radar</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e2e0da;--acc:#9b2c2c;--chip:#ece9e2}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1d;--ink:#eeece6;--mut:#a4a29a;--line:#34322e;--acc:#e07a6a;--chip:#2c2a27}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:15px;margin:0 0 4px}.meta{font-size:12.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px}.card p{margin:4px 0}a{color:var(--acc)}.links{font-size:13px;display:flex;gap:14px}
</style>
</head>
<body>
<main>
<h1>Markt-Radar</h1>
<p class="sub" id="stand">Lade …</p>
<div class="row" id="b"></div>
<div class="row" id="k"></div>
<div id="liste"></div>
</main>
<script>
var D=[],B="tabletop",K="Alle";
function chips(id,opts,cur,fn){var c=document.getElementById(id);c.innerHTML="";opts.forEach(function(o){var b=document.createElement("button");b.textContent=o[1];b.setAttribute("aria-pressed",o[0]===cur);b.onclick=function(){fn(o[0])};c.appendChild(b)})}
function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function draw(){
chips("b",[["tabletop","Tabletop"],["tcg","TCG"]],B,function(v){B=v;K="Alle";draw()});
var items=D.filter(function(x){return x.bereich===B});
var ks=["Alle"].concat(Array.from(new Set(items.map(function(x){return x.kategorie}))));
chips("k",ks.map(function(k){return[k,k]}),K,function(v){K=v;draw()});
var h="";items.filter(function(x){return K==="Alle"||x.kategorie===K}).forEach(function(x){
var q=encodeURIComponent("Ich möchte mehr zu dieser Meldung wissen: "+x.title+" ("+x.url+"). Recherchiere Hintergründe, Quellen und was das für Übertragungen und Wettbewerbs-Events bedeutet.");
h+='<div class="card"><h3>'+esc(x.title)+'</h3><div class="meta"><span class="tag">'+esc(x.kategorie)+'</span>'+(x.spiel?'<span>'+esc(x.spiel)+'</span>':'')+'<span>'+esc(x.source)+'</span><span>'+esc(x.date)+'</span></div><p>'+esc(x.zusammenfassung)+'</p><div class="links"><a href="'+esc(x.url)+'" rel="noopener">Quelle</a><a href="https://claude.ai/new?q='+q+'" rel="noopener">Mehr Infos</a></div></div>'});
document.getElementById("liste").innerHTML=h||"<p class='sub'>Noch keine Einträge.</p>"}
fetch("data.json").then(function(r){return r.json()}).then(function(j){D=j.items;document.getElementById("stand").textContent="Stand: "+j.stand.replace("T"," ").slice(0,16)+" UTC";draw()}).catch(function(){document.getElementById("stand").textContent="Noch keine Daten. Den Workflow einmal starten."});
</script>
</body>
</html>
